<div class="page">
    <div class="container">
        <h1>{{ "contact.title" | translate }}</h1>
        <div class="contact">
            <p>
                {{ "contact.emailLabel" | translate }}
                <button
                    (click)="onCopy('thomas@ambroise.io')"
                    (mouseenter)="onMouseEnter()"
                    (mouseleave)="onMouseLeave()">
                    thomas&#64;ambroise.io
                </button>
            </p>
        </div>
        <div
            class="copyVerif"
            [class]="stateClass()"
            [class.copyVerif--copied]="isCopied()"
            (animationend)="onToastDone($event)"
            [textContent]="alertTextKey() | translate"></div>
    </div>
</div>
