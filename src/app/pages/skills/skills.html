<div class="page">
    <div class="element">
        <h1>{{ "skills.title" | translate }}</h1>
        <app-async-state [loading]="loading()" [empty]="skills().length === 0">
            <div emptyState>
                <h2>{{ "skills.emptyTitle" | translate }}</h2>
                <h3>
                    {{ "skills.emptyMessage" | translate }}
                    <button (click)="linksUtils.openGithub()">Github</button>
                </h3>
            </div>
            <div class="container">
                @for (group of groups(); track group.titleKey; let i = $index) {
                <div class="container--wiuse" [style.animation-delay.s]="0.2 + i * 0.2">
                    <h3>{{ group.titleKey | translate }}</h3>
                    @for (item of group.items; track item.name) {
                    <div class="container--wiuse--use">
                        <i [class]="item.iconClass"></i>
                        <div class="container--wiuse--use--sep"></div>
                        <span [textContent]="item.name"></span>
                    </div>
                    }
                </div>
                }
            </div>
        </app-async-state>
    </div>
</div>
